name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4-stable
  IOS_PRESET:    iOS
  NAME:          ${{ github.event.repository.name }}
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Download Godot headless
      run: |
        curl -L \
          "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip" \
          -o godot.zip
        unzip -q godot.zip -d godot

    - name: Install iOS export template
      run: |
        templates_root="$HOME/Library/Application Support/Godot/export_templates"
        mkdir -p "$templates_root"
        cp -R "inner_world/export_templates/." "$templates_root/"

    - name: Export to Xcode project
      run: |
        mkdir -p inner_world/build/ios
        godot/Godot.app/Contents/MacOS/Godot --headless --path ./inner_world \
          --export-release "${IOS_PRESET}" build/ios/${NAME}.xcodeproj

    - name: xcodebuild archive (unsigned)
      run: |
        xcodebuild archive \
          -project inner_world/build/ios/${NAME}.xcodeproj \
          -scheme "${NAME}" \
          -archivePath inner_world/build/ios/App.xcarchive \
          -configuration Release \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty

    - name: Package IPA
      run: |
        cd inner_world/build/ios
        mkdir -p Payload
        cp -R App.xcarchive/Products/Applications/*.app Payload/
        zip -r "${NAME}.ipa" Payload
        mv "${NAME}.ipa" $GITHUB_WORKSPACE/

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-ipa
        path: ${{ env.NAME }}.ipa
        retention-days: 14

    # ★ 新增：仅在推送 tag 时发布到 Release
    - name: Publish to Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.NAME }}.ipa
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}